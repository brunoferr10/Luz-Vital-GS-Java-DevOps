services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Fill RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Fill RABBIT_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
volumes:
  rabbit-data:
